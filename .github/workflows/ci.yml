name: CI

on:
  push:
    branches: [ "main", "master", "feat-log-analyzer-electron" ]
  pull_request:
    branches: [ "main", "master", "feat-log-analyzer-electron" ]

defaults:
  run:
    working-directory: ./log-analyzer-dashboard

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: log-analyzer-dashboard/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npm run test -- --run
      
    - name: Build Application
      run: npm run build
