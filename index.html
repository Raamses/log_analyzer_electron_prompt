<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIS/Azure APGW Log Analyzer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="typescript,react">
        const httpStatusCodes = { 400: "Bad Request", 401: "Unauthorized", 403: "Forbidden", 404: "Not Found", 500: "Internal Server Error", 502: "Bad Gateway", 503: "Service Unavailable", 504: "Gateway Timeout" };

        const Modal = ({ title, content, onClose }) => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div className="bg-gray-800 rounded-lg p-6 max-w-sm w-full">
                    <h2 className="text-xl font-bold mb-4">{title}</h2>
                    <p>{content}</p>
                    <button onClick={onClose} className="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Close</button>
                </div>
            </div>
        );

        const SummaryCard = ({ title, value, unit }) => (
            <div className="bg-gray-800 p-4 rounded-lg text-center">
                <h3 className="text-md font-semibold text-gray-400">{title}</h3>
                <p className="text-3xl font-bold mt-2">{value} <span className="text-lg">{unit}</span></p>
            </div>
        );

        const ErrorSummary = ({ analytics, onCodeClick }) => (
            <div className="bg-gray-800 p-4 rounded-lg col-span-1 md:col-span-2 lg:col-span-1">
                <h3 className="text-lg font-semibold mb-3">Error Summary</h3>
                <div className="grid grid-cols-2 gap-4">
                    <SummaryCard title="Total Errors" value={analytics.totalErrors} />
                    <SummaryCard title="Error Rate" value={analytics.errorRate.toFixed(2)} unit="%" />
                    <SummaryCard title="Client Errors (4xx)" value={analytics.clientErrors} />
                    <SummaryCard title="Server Errors (5xx)" value={analytics.serverErrors} />
                </div>
                <div className="mt-4">
                    <h4 className="font-semibold">Error Code Breakdown</h4>
                    <ul className="mt-2 text-sm">
                        {Object.entries(analytics.errorCodes).map(([code, count]) => (
                            <li key={code} className="flex justify-between cursor-pointer hover:bg-gray-700 p-1 rounded" onClick={() => onCodeClick(code)}><span>{code}</span> <span>{count}</span></li>
                        ))}
                    </ul>
                </div>
            </div>
        );

        const TrafficSegmentation = ({ analytics }) => {
            const [activeTab, setActiveTab] = React.useState('endpoints');
            const handleIpRightClick = (e, ip) => {
                e.preventDefault();
                window.open(`https://whois.domaintools.com/${ip}`, '_blank');
            };

            return (
                <div className="bg-gray-800 p-4 rounded-lg col-span-1 md:col-span-2">
                    <div className="flex border-b border-gray-700 mb-4">
                        <button onClick={() => setActiveTab('endpoints')} className={`py-2 px-4 ${activeTab === 'endpoints' ? 'border-b-2 border-blue-500' : ''}`}>Top Endpoints</button>
                        <button onClick={() => setActiveTab('ips')} className={`py-2 px-4 ${activeTab === 'ips' ? 'border-b-2 border-blue-500' : ''}`}>Top Calling IPs</button>
                        <button onClick={() => setActiveTab('search')} className={`py-2 px-4 ${activeTab === 'search' ? 'border-b-2 border-blue-500' : ''}`}>Search Statistics</button>
                    </div>
                    {activeTab === 'endpoints' && (
                        <table className="w-full text-sm text-left">
                            <thead><tr className="text-gray-400"><th className="py-2">Endpoint</th><th>Total Calls</th><th>Avg Latency (ms)</th><th>P95 Latency (ms)</th></tr></thead>
                            <tbody>{analytics.topEndpoints.map(e => (<tr key={e.uri} className="border-t border-gray-700"><td className="py-2">{e.uri}</td><td>{e.totalCalls}</td><td>{e.avgLatency.toFixed(2)}</td><td>{e.p95Latency.toFixed(2)}</td></tr>))}</tbody>
                        </table>
                    )}
                    {activeTab === 'ips' && (
                         <table className="w-full text-sm text-left">
                            <thead><tr className="text-gray-400"><th className="py-2">IP Address (right-click for Whois)</th><th>Request Count</th></tr></thead>
                            <tbody>{analytics.topIps.map(([ip, count]) => (<tr key={ip} className="border-t border-gray-700"><td className="py-2" onContextMenu={(e) => handleIpRightClick(e, ip)}>{ip}</td><td>{count}</td></tr>))}</tbody>
                        </table>
                    )}
                    {activeTab === 'search' && (
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <h4 className="font-semibold mb-2">Top 10 Hotel Codes</h4>
                                <table className="w-full text-sm text-left">
                                    <thead><tr className="text-gray-400"><th className="py-2">Hotel Code</th><th>Count</th></tr></thead>
                                    <tbody>{analytics.searchStats.topHotelCodes.map(([code, count]) => (<tr key={code} className="border-t border-gray-700"><td className="py-2">{code}</td><td>{count}</td></tr>))}</tbody>
                                </table>
                            </div>
                             <div>
                                <h4 className="font-semibold mb-2">Top 10 Compositions</h4>
                                <table className="w-full text-sm text-left">
                                    <thead><tr className="text-gray-400"><th className="py-2">Composition</th><th>Count</th></tr></thead>
                                    <tbody>{analytics.searchStats.topCompositions.map(([comp, count]) => (<tr key={comp} className="border-t border-gray-700"><td className="py-2">{comp}</td><td>{count}</td></tr>))}</tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ServerThroughput = ({ analytics }) => (
            <div className="bg-gray-800 p-4 rounded-lg col-span-1 md:col-span-2">
                <h3 className="text-lg font-semibold mb-3">Server Throughput</h3>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <SummaryCard title="Mean RPM (1min)" value={analytics.throughput.rpm1.mean} />
                    <SummaryCard title="Max RPM (1min)" value={analytics.throughput.rpm1.max} />
                    <SummaryCard title="Mean RPM (15min)" value={analytics.throughput.rpm15.mean} />
                    <SummaryCard title="Max RPM (15min)" value={analytics.throughput.rpm15.max} />
                    <SummaryCard title="Mean RPM (60min)" value={analytics.throughput.rpm60.mean} />
                    <SummaryCard title="Max RPM (60min)" value={analytics.throughput.rpm60.max} />
                </div>
            </div>
        );

        const VirtualizedLogViewer = ({ logs, rowHeight = 24, containerHeight = 400 }) => {
            const [scrollTop, setScrollTop] = React.useState(0);
            const containerRef = React.useRef(null);
            const startIndex = Math.floor(scrollTop / rowHeight);
            const endIndex = Math.min(startIndex + Math.ceil(containerHeight / rowHeight), logs.length);
            const visibleLogs = logs.slice(startIndex, endIndex);

            return (
                <div ref={containerRef} className="h-96 overflow-y-auto bg-gray-700 rounded-md p-2 relative" style={{ height: `${containerHeight}px` }} onScroll={(e) => setScrollTop(e.currentTarget.scrollTop)}>
                    <div style={{ height: `${logs.length * rowHeight}px` }}>
                        <div style={{ position: 'absolute', top: `${startIndex * rowHeight}px`, left: 0, right: 0 }}>
                            {visibleLogs.map((log, index) => (
                                <div key={startIndex + index} className="font-mono text-sm whitespace-pre" style={{ height: `${rowHeight}px` }}>
                                    {`${log.timestamp.toISOString()} | ${log.statusCode} | ${log.clientIp.padEnd(15)} | ${log.timeTaken.toFixed(2).padStart(8)}ms | ${log.uriStem}`}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [logContent, setLogContent] = React.useState('');
            const [parsedLogs, setParsedLogs] = React.useState([]);
            const [error, setError] = React.useState('');
            const [isParsed, setIsParsed] = React.useState(false);
            const [modalInfo, setModalInfo] = React.useState(null);
            const fileInputRef = React.useRef(null);

            const analytics = React.useMemo(() => {
                if (parsedLogs.length === 0) return null;
                const sortedLogs = [...parsedLogs].sort((a, b) => a.timestamp - b.timestamp);
                const startTime = sortedLogs[0].timestamp, endTime = sortedLogs[sortedLogs.length - 1].timestamp;
                const totalRequests = sortedLogs.length, timeSpan = endTime - startTime;
                const errors = sortedLogs.filter(log => log.statusCode >= 400), totalErrors = errors.length;
                const errorRate = totalRequests > 0 ? (totalErrors / totalRequests) * 100 : 0;
                const clientErrors = errors.filter(log => log.statusCode >= 400 && log.statusCode < 500).length;
                const serverErrors = errors.filter(log => log.statusCode >= 500).length;
                const errorCodes = errors.reduce((acc, log) => { acc[log.statusCode] = (acc[log.statusCode] || 0) + 1; return acc; }, {});
                const p95 = (arr) => { if (arr.length === 0) return 0; const sorted = [...arr].sort((a, b) => a - b); const index = Math.ceil(0.95 * sorted.length) - 1; return sorted[index]; };
                const endpoints = sortedLogs.reduce((acc, log) => { if (!acc[log.uriStem]) acc[log.uriStem] = { calls: 0, latencies: [] }; acc[log.uriStem].calls++; acc[log.uriStem].latencies.push(log.timeTaken); return acc; }, {});
                const topEndpoints = Object.entries(endpoints).map(([uri, data]) => ({ uri, totalCalls: data.calls, avgLatency: data.latencies.reduce((a, b) => a + b, 0) / data.calls, p95Latency: p95(data.latencies), })).sort((a, b) => b.totalCalls - a.totalCalls).slice(0, 10);
                const ips = sortedLogs.reduce((acc, log) => { acc[log.clientIp] = (acc[log.clientIp] || 0) + 1; return acc; }, {});
                const topIps = Object.entries(ips).sort((a, b) => b[1] - a[1]).slice(0, 10);

                const searchLogs = sortedLogs.filter(log => log.uriStem.startsWith('singleHotelSearch'));
                const hotelCodes = searchLogs.reduce((acc, log) => { try { const code = new URLSearchParams(log.uriStem.split('?')[1]).get('hotelCode'); if (code) acc[code] = (acc[code] || 0) + 1; } catch (e) {} return acc; }, {});
                const compositions = searchLogs.reduce((acc, log) => { try { const comp = new URLSearchParams(log.uriStem.split('?')[1]).get('composition'); if (comp) acc[comp] = (acc[comp] || 0) + 1; } catch (e) {} return acc; }, {});

                const getThroughput = (windowSize) => {
                    const requestsPerWindow = {};
                    sortedLogs.forEach(log => {
                        const window = Math.floor(log.timestamp.getTime() / (windowSize * 60000));
                        requestsPerWindow[window] = (requestsPerWindow[window] || 0) + 1;
                    });
                    const windowValues = Object.values(requestsPerWindow);
                    const mean = windowValues.length > 0 ? (windowValues.reduce((a, b) => a + b, 0) / windowValues.length) / windowSize : 0;
                    const max = windowValues.length > 0 ? Math.max(...windowValues) / windowSize : 0;
                    return { mean: mean.toFixed(2), max: max.toFixed(2) };
                };

                return {
                    totalRequests,
                    timeSpan: (timeSpan / 1000 / 60).toFixed(2),
                    totalErrors,
                    errorRate,
                    clientErrors,
                    serverErrors,
                    errorCodes,
                    topEndpoints,
                    topIps,
                    searchStats: {
                        topHotelCodes: Object.entries(hotelCodes).sort((a,b) => b[1]-a[1]).slice(0,10),
                        topCompositions: Object.entries(compositions).sort((a,b) => b[1]-a[1]).slice(0,10),
                    },
                    throughput: {
                        rpm1: getThroughput(1),
                        rpm15: getThroughput(15),
                        rpm60: getThroughput(60),
                    }
                };
            }, [parsedLogs]);

            const parseLogs = (content) => {
                setError('');
                const lines = content.trim().split('\n');
                if (lines.length === 0) { setParsedLogs([]); return; }
                let format = null, fields = {}, headerLine = -1;
                for(let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.startsWith('#Fields:')) { format = 'IIS'; const f = line.substring(9).trim().split(' '); fields = { date: f.indexOf('date'), time: f.indexOf('time'), uri: f.indexOf('cs-uri-stem'), status: f.indexOf('sc-status'), timeTaken: f.indexOf('time-taken'), ip: f.indexOf('c-ip') }; headerLine = i; break; }
                    if (line.includes('TimeGenerated[UTC]') && line.includes('RequestUri')) { format = 'AzureAPGW'; const f = line.split(','); fields = { time: f.indexOf('TimeGenerated[UTC]'), status: f.indexOf('HttpStatus'), uri: f.indexOf('RequestUri'), ip: f.indexOf('ClientIp'), timeTaken: f.indexOf('TimeTaken') }; headerLine = i; break; }
                }
                if (!format) { setError('Invalid log format.'); setParsedLogs([]); setIsParsed(false); return; }
                const data = [];
                for (let i = headerLine + 1; i < lines.length; i++) {
                    if (lines[i].startsWith('#') || lines[i].trim() === '') continue;
                    let values = format === 'IIS' ? lines[i].split(' ') : lines[i].split(',');
                    try {
                        let uri = values[fields.uri]; if (uri.includes("searchresult")) uri = 'singleHotelSearch?' + uri.split('?')[1];
                        const timeTaken = format === 'AzureAPGW' ? parseFloat(values[fields.timeTaken]) * 1000 : parseFloat(values[fields.timeTaken]);
                        const logEntry = { timestamp: format === 'IIS' ? new Date(`${values[fields.date]}T${values[fields.time]}Z`) : new Date(values[fields.time]), uriStem: uri, statusCode: parseInt(values[fields.status], 10), timeTaken: timeTaken, clientIp: values[fields.ip], };
                        if (!isNaN(logEntry.timestamp.getTime())) data.push(logEntry);
                    } catch (e) { /* ignore */ }
                }
                setParsedLogs(data); setIsParsed(data.length > 0);
                if (data.length === 0 && !error) setError('Parsed, but no valid entries found.');
            };
            React.useEffect(() => { logContent ? parseLogs(logContent) : (setParsedLogs([]), setIsParsed(false), setError('')); }, [logContent]);
            const handleFileChange = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (event) => setLogContent(event.target.result); reader.readAsText(file); } };
            const handlePaste = (e) => setLogContent(e.clipboardData.getData('text'));
            const handleDrop = (e) => { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file) { const reader = new FileReader(); reader.onload = (event) => setLogContent(event.target.result); reader.readAsText(file); } };
            const handleCodeClick = (code) => setModalInfo({ title: `HTTP ${code}`, content: httpStatusCodes[code] || "No description available." });

            return (
                <div className="container mx-auto p-4">
                    {modalInfo && <Modal {...modalInfo} onClose={() => setModalInfo(null)} />}
                    <h1 className="text-3xl font-bold text-center mb-6">IIS/Azure APGW Log Analyzer</h1>
                    <div className={`bg-gray-800 p-4 rounded-lg border-2 border-dashed border-gray-600 hover:border-gray-400 transition-all duration-300 ${isParsed ? 'h-24' : 'h-60'}`} onDrop={handleDrop} onDragOver={(e) => e.preventDefault()}>
                        <textarea className={`w-full bg-gray-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300 ${isParsed ? 'h-0 opacity-0' : 'h-40'}`} placeholder="Paste/drop logs or select file" value={logContent} onChange={(e) => setLogContent(e.target.value)} onPaste={handlePaste} readOnly={isParsed}></textarea>
                        {isParsed ? (<div className="text-center text-green-400"><p>Parsed {parsedLogs.length} entries.</p><button onClick={() => setLogContent('')} className="text-blue-400 underline mt-2">Clear</button></div>) : (<div className="mt-4 text-center"><button className="bg-blue-600 hover:bg-blue-700 font-bold py-2 px-4 rounded-lg" onClick={() => fileInputRef.current.click()}>Select File</button><input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".log,.txt,.csv" /></div>)}
                    </div>
                    {error && <div className="mt-4 text-center text-red-400 bg-red-900 p-3 rounded-lg">{error}</div>}
                    {analytics && (
                        <div className="mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <SummaryCard title="Total Requests" value={analytics.totalRequests} />
                            <SummaryCard title="Log Time Span" value={analytics.timeSpan} unit="min" />
                            <ErrorSummary analytics={analytics} onCodeClick={handleCodeClick} />
                            <TrafficSegmentation analytics={analytics} />
                            <ServerThroughput analytics={analytics} />
                        </div>
                    )}
                    <div className="mt-8 bg-gray-800 p-4 rounded-lg">
                        <h2 className="text-xl font-semibold mb-4">Raw Logs Viewer</h2>
                        {isParsed && <VirtualizedLogViewer logs={parsedLogs} />}
                    </div>
                </div>
            );
        };
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
